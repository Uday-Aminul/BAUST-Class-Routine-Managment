services:
  db:
    build: ../ClassroomManagement.Api/db/
    environment:
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:-YourStrong!Pass123}
    ports:
      - 1434:1433
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -d ClassroomDb -b -Q "SELECT TOP 1 1 FROM Classrooms" || exit 1
      interval: 10s
      retries: 10
      start_period: 30s

volumes:
  sqldata:
