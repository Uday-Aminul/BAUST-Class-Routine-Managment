name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore ClassRoutineManagement.Tests

      - name: Build
        run: dotnet build ClassRoutineManagement.Tests --no-restore

      - name: Start SQL Server (waits until the schema is loaded)
        run: docker compose -f ClassRoutineManagement.Tests/IntegrationTest.yml up -d --build --wait

      - name: Show db logs on failure
        if: failure()
        run: docker compose -f ClassRoutineManagement.Tests/IntegrationTest.yml logs db

      - name: Run tests
        run: dotnet test ClassRoutineManagement.Tests --no-build --verbosity normal

      - name: Tear down DB
        if: always()
        run: docker compose -f ClassRoutineManagement.Tests/IntegrationTest.yml down -v
